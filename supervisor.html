<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALICORP Supervisor V5</title><style>
:root{--red:#c8102e;--red2:#8f0b22;--bg:#f4f6f8;--txt:#1f2937;--mut:#6b7280;--green:#15803d;--blue:#1d4ed8}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt)}
header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:21px}.sub{font-size:13px;opacity:.92;margin-top:4px}.wrap{max-width:1050px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 4px 18px #00000014}
.note{font-size:13px;padding:10px 12px;border-radius:9px;background:#ecfdf5;color:#166534;border:1px solid #bbf7d0;margin-bottom:14px}
.warn{font-size:12px;padding:9px 11px;border-radius:9px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:8px 0 4px}
input,select,textarea,button{width:100%;min-height:44px;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit;font-size:16px}
textarea{min-height:72px;resize:vertical}
button{border:0;background:var(--red);color:#fff;font-weight:800;cursor:pointer;margin-top:10px}
button.blue{background:var(--blue)}button.green{background:var(--green)}button.gray{background:#4b5563}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:6px 9px;border-radius:999px;background:#fee2e2;color:#991b1b;font-weight:800}
.conn.ok{background:#dcfce7;color:#166534}
.task{border:1px solid #e5e7eb;border-left-width:8px;border-radius:11px;padding:12px;margin:10px 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--mut);line-height:1.55;margin-top:6px}
.badge,.instr,.assigned{display:inline-block;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px}
.assigned{background:#ede9fe;color:#5b21b6}
.s-pendiente{border-left-color:#6b7280;background:#f9fafb}
.s-tomada{border-left-color:#2563eb;background:#eff6ff}
.s-en-camino{border-left-color:#f59e0b;background:#fffbeb}
.s-en-ubicacion{border-left-color:#eab308;background:#fefce8}
.s-reposicion-realizada{border-left-color:#16a34a;background:#f0fdf4}
.s-finalizada{border-left-color:#166534;background:#ecfdf5}
.i-green{background:#dcfce7;color:#166534;border:1px solid #86efac}
.i-yellow{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
.i-red{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
#instruction.i-green{background:#dcfce7;color:#166534;border:2px solid #22c55e;font-weight:800}
#instruction.i-yellow{background:#fef9c3;color:#854d0e;border:2px solid #eab308;font-weight:800}
#instruction.i-red{background:#fee2e2;color:#991b1b;border:2px solid #ef4444;font-weight:800}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.legend span{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px}
.toast{position:fixed;left:12px;right:12px;bottom:12px;max-width:520px;margin:auto;background:#111827;color:white;padding:12px 14px;border-radius:10px;box-shadow:0 8px 24px #0004;display:none;z-index:999}
.small{font-size:12px;color:var(--mut)}
.diag{font-size:11px;color:#6b7280;margin-top:6px;word-break:break-word}
@media(max-width:760px){.grid{grid-template-columns:1fr}header button{width:100%!important}.card{padding:13px}.wrap{padding:0 9px}}
</style></head>
<body><header><div><h1>ALICORP · Supervisor</h1><div class="sub">Asignación / reasignación de ETV</div></div><div><div id="conn" class="conn">Conectando...</div><div id="diag" class="diag"></div></div></header>
<div class="wrap"><div class="note">El Supervisor puede asignar o cambiar el ETV. El cambio se comparte por internet.</div>
<div class="warn">Abre esta página desde su enlace HTTPS en Chrome o Safari. Piloto con datos ficticios.</div>
<div class="card"><h2>Cola de reposiciones</h2><div id="list"></div><button type="button" class="gray" onclick="testConn()">PROBAR CONEXIÓN</button></div></div><div id="toast" class="toast"></div>
<script>
const ROLE="supervisor"; const NOTIF_TOPIC="alicorp/piloto/33cda81c433f09c0aa4b479f/notif/supervisor";
const BASE="alicorp/piloto/33cda81c433f09c0aa4b479f";
const TOPIC_STATE=BASE+"/state";
const TOPIC_NOTIF_PICK=BASE+"/notif/pickero";
const TOPIC_NOTIF_JUNIOR=BASE+"/notif/junior";
const TOPIC_NOTIF_SUP=BASE+"/notif/supervisor";
const BROKERS=[["Shiftr","wss://public.cloud.shiftr.io","public","public"],["EMQX","wss://broker.emqx.io:8084/mqtt","",""],["Mosquitto","wss://test.mosquitto.org:8081/mqtt","",""]];
const ETWS=[{rf:"AAREVALO",name:"Álex Arévalo"},{rf:"JROJAS",name:"Junior Rojas"},{rf:"JLLERENA",name:"Junior Llerena"},{rf:"LUNA",name:"Jhony Luna"},{rf:"RUFASTO",name:"Ernesto Rufasto"},{rf:"MVIVANCO",name:"Marco Vivanco"},{rf:"RHUAMAN",name:"Roberto Huamán"}];
const STATES=["Pendiente","Tomada","En camino","En ubicación","Reposición realizada","Finalizada"];
let tasks=[], rev=0, ready=false, brokers=[], statusMap={};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function statusClass(s){return "s-"+String(s||"Pendiente").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/s+/g,"-")}
function instrClass(s){s=String(s||"").toLowerCase();return s.includes("dejar")?"i-green":s.includes("hacer")?"i-yellow":"i-red"}
function now(){return new Date().toISOString()}
function toast(m){const t=document.getElementById("toast");if(t){t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3800)}}
function connectedCount(){return brokers.filter(b=>b.connected).length}
function updateConn(){const n=connectedCount(),c=document.getElementById("conn"),d=document.getElementById("diag");if(c){if(n>0){c.textContent="Servidor conectado ("+n+"/"+BROKERS.length+")";c.className="conn ok"}else{c.textContent="Conectando...";c.className="conn"}}if(d)d.textContent=Object.entries(statusMap).map(([k,v])=>k+": "+v).join(" · ")}
function brokerStatus(b,ok,msg){statusMap[b.name]=msg;updateConn()}
function browserNotify(title,body){if("Notification"in window&&Notification.permission==="granted"){try{new Notification(title,{body})}catch(e){}}}
async function askNotify(){if("Notification"in window){const p=await Notification.requestPermission();toast(p==="granted"?"Avisos activados":"Las alertas internas seguirán funcionando")}}
function publishAll(topic,message,retain=false){let ok=0;brokers.forEach(b=>{if(b.publish(topic,message,retain))ok++});return ok>0}
function publishState(){rev=Date.now();const payload=JSON.stringify({rev,tasks,updated_at:now()});if(!publishAll(TOPIC_STATE,payload,true)){toast("No hay conexión con el servidor todavía.");return false}return true}
function publishNotif(topic,message){publishAll(topic,JSON.stringify({message,time:now()}),false)}
function brokerMessage(b,topic,msg){try{const obj=JSON.parse(msg);if(topic===TOPIC_STATE){const incomingRev=Number(obj.rev||0);if(incomingRev>rev){rev=incomingRev;tasks=Array.isArray(obj.tasks)?obj.tasks:[];ready=true;render();brokers.forEach(other=>{if(other!==b&&other.connected)other.publish(TOPIC_STATE,JSON.stringify({rev,tasks,updated_at:obj.updated_at||now()}),true)})}}else if(topic===NOTIF_TOPIC){toast(obj.message||"Nueva actualización");browserNotify("ALICORP",obj.message||"Nueva actualización")}}catch(e){}}
function startBrokers(){statusMap={};brokers=BROKERS.map(([name,url,user,pass])=>new MiniMQTT(url,name,brokerStatus,brokerMessage,user,pass));brokers.forEach(b=>b.connect());setTimeout(()=>{if(!ready){ready=true;render()}},3500);setTimeout(()=>{if(connectedCount()===0){const c=document.getElementById("conn");if(c)c.textContent="Sin conexión al servidor";toast("No se pudo conectar al servidor. Intenta nuevamente.")}},14000)}
class MiniMQTT{
constructor(url,name,onStatus,onMessage,username="",password=""){this.url=url;this.name=name;this.onStatus=onStatus;this.onMessage=onMessage;this.username=username;this.password=password;this.ws=null;this.connected=false;this.packetId=1;this.buf=new Uint8Array(0);this.keepTimer=null;this.reTimer=null;this.closedByUser=false}
u8(s){if(window.TextEncoder)return new TextEncoder().encode(s);const x=unescape(encodeURIComponent(s)),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
s8(a){if(window.TextDecoder)return new TextDecoder().decode(a);let s="";for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);try{return decodeURIComponent(escape(s))}catch(e){return s}}
mstr(s){const b=this.u8(s),o=new Uint8Array(2+b.length);o[0]=(b.length>>8)&255;o[1]=b.length&255;o.set(b,2);return o}
concat(...arrs){let n=0;arrs.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;arrs.forEach(a=>{o.set(a,p);p+=a.length});return o}
rem(n){const a=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d)}while(n>0);return new Uint8Array(a)}
pack(h,payload){return this.concat(new Uint8Array([h]),this.rem(payload.length),payload)}
connectPacket(){const proto=this.mstr("MQTT"),hasAuth=!!this.username,flags=hasAuth?194:2,vh=this.concat(proto,new Uint8Array([4,flags,0,30])),cid=this.mstr("alicorp_"+ROLE+"_"+Math.random().toString(16).slice(2,10)),auth=hasAuth?this.concat(this.mstr(this.username),this.mstr(this.password||"")):new Uint8Array(0);return this.pack(0x10,this.concat(vh,cid,auth))}
subscribePacket(topic){this.packetId=(this.packetId%65535)+1;const pid=new Uint8Array([(this.packetId>>8)&255,this.packetId&255]),body=this.concat(pid,this.mstr(topic),new Uint8Array([0]));return this.pack(0x82,body)}
publishPacket(topic,message,retain){const body=this.concat(this.mstr(topic),this.u8(message));return this.pack(0x30|(retain?1:0),body)}
connect(){this.closedByUser=false;try{this.onStatus(this,false,"conectando");this.ws=new WebSocket(this.url,["mqtt"]);this.ws.binaryType="arraybuffer";this.ws.onopen=()=>{try{this.ws.send(this.connectPacket())}catch(e){this.fail("envío CONNECT")}};this.ws.onmessage=ev=>{const incoming=new Uint8Array(ev.data);this.buf=this.concat(this.buf,incoming);this.parse()};this.ws.onerror=()=>this.onStatus(this,false,"error");this.ws.onclose=()=>{this.connected=false;clearInterval(this.keepTimer);this.onStatus(this,false,"cerrado");if(!this.closedByUser){clearTimeout(this.reTimer);this.reTimer=setTimeout(()=>this.connect(),3500)}}}catch(e){this.onStatus(this,false,"bloqueado");clearTimeout(this.reTimer);this.reTimer=setTimeout(()=>this.connect(),5000)}}
fail(msg){this.onStatus(this,false,msg);try{this.ws.close()}catch(e){}}
parse(){while(this.buf.length>=2){let mul=1,rem=0,i=1,d;do{if(i>=this.buf.length)return;d=this.buf[i++];rem+=(d&127)*mul;mul*=128;if(mul>128*128*128*128)return this.fail("paquete inválido")}while(d&128);if(this.buf.length<i+rem)return;const h=this.buf[0],p=this.buf.slice(i,i+rem);this.buf=this.buf.slice(i+rem);const type=h>>4;if(type===2){if(p.length>=2&&p[1]===0){this.connected=true;this.onStatus(this,true,"conectado");clearInterval(this.keepTimer);this.keepTimer=setInterval(()=>{if(this.connected&&this.ws&&this.ws.readyState===1)this.ws.send(new Uint8Array([0xC0,0x00]))},20000);this.subscribe(TOPIC_STATE);this.subscribe(NOTIF_TOPIC)}else this.fail("CONNACK rechazado")}else if(type===3){if(p.length<2)continue;const len=(p[0]<<8)|p[1];if(p.length<2+len)continue;const topic=this.s8(p.slice(2,2+len)),msg=this.s8(p.slice(2+len));this.onMessage(this,topic,msg)}}}
subscribe(topic){if(this.connected&&this.ws&&this.ws.readyState===1){try{this.ws.send(this.subscribePacket(topic))}catch(e){}}}
publish(topic,msg,retain=false){if(!(this.connected&&this.ws&&this.ws.readyState===1))return false;try{this.ws.send(this.publishPacket(topic,msg,retain));return true}catch(e){return false}}
}
const pendingSelection={};
function rememberSelection(i,v){pendingSelection[i]=v}
function testConn(){toast(connectedCount()>0?"✓ Conexión correcta.":"Todavía no conecta. Revisa el detalle de arriba.")}
function assign(id,idx){if(connectedCount()===0)return toast("Sin conexión.");const t=tasks.find(x=>x.task_id===id);if(!t)return toast("Tarea no encontrada.");if(t.status==="Finalizada")return toast("No se puede reasignar una tarea finalizada.");const sel=document.getElementById("sel-"+idx),selectedRf=(pendingSelection[idx]||sel.value),e=ETWS.find(x=>x.rf===selectedRf);if(!e)return;const old=t.etv||"Sin asignar";t.etv=e.name;t.etv_rf=e.rf;t.updated_at=now();if(!publishState())return;publishNotif(TOPIC_NOTIF_PICK,id+": "+old+" → "+e.name);publishNotif(TOPIC_NOTIF_JUNIOR,"Tarea asignada a "+e.name+": "+id+" · P"+t.aisle+"/U"+t.location+" · "+t.instruction);delete pendingSelection[idx];toast("✓ ETV asignado: "+e.name);render()}
function render(){const el=document.getElementById("list");if(!el)return;el.innerHTML=tasks.length?tasks.map((t,i)=>{const opts=ETWS.map(e=>`<option value="${e.rf}" ${e.rf===t.etv_rf?"selected":""}>${esc(e.name)} · ${e.rf}</option>`).join("");const dis=t.status==="Finalizada"?"disabled":"";return `<div class="task ${statusClass(t.status)}"><div class="head"><b>${esc(t.task_id)}</b><span class="badge">${esc(t.status)}</span></div><div class="meta">${esc(t.pickero||"Pickero")} · P${esc(t.aisle)} / U${esc(t.location)} · <span class="instr ${instrClass(t.instruction)}">${esc(t.instruction)}</span><br><span class="assigned">ETV actual: ${esc(t.etv||"Sin asignar")}</span></div><label>ETV asignado</label><select id="sel-${i}" ${dis} onchange="rememberSelection(${i},this.value)">${opts}</select><button type="button" class="blue" ${dis} onclick="assign('${esc(t.task_id)}',${i})">GUARDAR CAMBIO DE ETV</button></div>`}).join(""):'<div class="small">Sin tareas.</div>'}
render();startBrokers();
</script></body></html>
